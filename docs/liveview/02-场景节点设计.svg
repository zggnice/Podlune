<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="HarmonyOS Sans SC, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C4DFF"/></marker></defs><rect width="1280" height="1000" fill="#FFFFFF"/><text x="32" y="50" font-size="25" font-weight="700" fill="#111318">Podlune 实况窗场景节点设计</text><text x="32" y="78" font-size="13" fill="#5B6472">场景一：计时（睡眠定时） · 场景二：进度类型（批量下载 / 备份导入导出）</text><rect x="20" y="104" width="1240" height="330" rx="18" fill="#FBFAFF" stroke="#E6E1FB"/><text x="40" y="134" font-size="16" font-weight="700" fill="#7C4DFF">场景一 · 计时：睡眠定时</text><rect x="40" y="160" width="200" height="112" rx="14" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.5"/><text x="54" y="188" font-size="15" font-weight="700" fill="#111318">N1 启动</text><text x="54" y="210" font-size="12" fill="#5B6472">播放器开启睡眠定时</text><text x="54" y="229" font-size="12" fill="#5B6472">15/30/45/60 分钟或自定义</text><text x="54" y="248" font-size="12" fill="#5B6472">摇一摇可重置倒计时</text><rect x="290" y="160" width="200" height="112" rx="14" fill="#F3EFFF" stroke="#C9B8FF" stroke-width="1.5"/><text x="304" y="188" font-size="15" font-weight="700" fill="#4A2FB8">N2 运行中</text><text x="304" y="210" font-size="12" fill="#5B6472">剩余时间每 30 秒刷新</text><text x="304" y="229" font-size="12" fill="#5B6472">副标题＝当前单集标题</text><text x="304" y="248" font-size="12" fill="#5B6472">胶囊：沙漏 + 剩余时间</text><rect x="540" y="160" width="200" height="112" rx="14" fill="#FFF7E8" stroke="#F0D49B" stroke-width="1.5"/><text x="554" y="188" font-size="15" font-weight="700" fill="#8A5B00">N3 渐弱中</text><text x="554" y="210" font-size="12" fill="#5B6472">剩余 ≤ 30 秒且开启渐弱</text><text x="554" y="229" font-size="12" fill="#5B6472">文案：即将暂停 · 音量渐弱中</text><text x="554" y="248" font-size="12" fill="#5B6472">最后 1 分钟每秒刷新</text><rect x="790" y="160" width="200" height="112" rx="14" fill="#FFF7E8" stroke="#F0D49B" stroke-width="1.5"/><text x="804" y="188" font-size="15" font-weight="700" fill="#8A5B00">N4 等章节结束</text><text x="804" y="210" font-size="12" fill="#5B6472">计时到点但选了「章节后暂停」</text><text x="804" y="229" font-size="12" fill="#5B6472">文案：等待本章播完再暂停</text><text x="804" y="248" font-size="12" fill="#5B6472">操作：立即暂停 / 结束</text><rect x="1040" y="160" width="200" height="112" rx="14" fill="#EAF7EE" stroke="#A9D9B8" stroke-width="1.5"/><text x="1054" y="188" font-size="15" font-weight="700" fill="#1F6B3A">N5 完成</text><text x="1054" y="210" font-size="12" fill="#5B6472">到点暂停成功</text><text x="1054" y="229" font-size="12" fill="#5B6472">显示 5 秒后自动关闭</text><text x="1054" y="248" font-size="12" fill="#5B6472">操作：继续播放</text><rect x="40" y="300" width="200" height="112" rx="14" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.5"/><text x="54" y="328" font-size="15" font-weight="700" fill="#111318">N6 取消</text><text x="54" y="350" font-size="12" fill="#5B6472">点「暂停定时」或「结束」</text><text x="54" y="369" font-size="12" fill="#5B6472">立即关闭实况窗</text><text x="54" y="388" font-size="12" fill="#5B6472">播放行为按用户选择执行</text><rect x="1040" y="300" width="200" height="112" rx="14" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.5"/><text x="1054" y="328" font-size="15" font-weight="700" fill="#111318">N7 退出</text><text x="1054" y="350" font-size="12" fill="#5B6472">实况窗关闭</text><text x="1054" y="369" font-size="12" fill="#5B6472">无残留卡片 / 胶囊</text><path d="M240,216 C265.0,216 265.0,216 290,216" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="265.0" y="210" font-size="12" fill="#5B6472" text-anchor="middle">开启</text><path d="M490,216 C515.0,216 515.0,216 540,216" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="515.0" y="210" font-size="12" fill="#5B6472" text-anchor="middle">剩 30s</text><path d="M740,216 C765.0,216 765.0,216 790,216" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="765.0" y="210" font-size="12" fill="#5B6472" text-anchor="middle">计时到点</text><path d="M990,216 C1015.0,216 1015.0,216 1040,216" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="1015.0" y="210" font-size="12" fill="#5B6472" text-anchor="middle">暂停完成</text><line x1="1140.0" y1="272" x2="1140.0" y2="300" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><line x1="140.0" y1="272" x2="140.0" y2="300" stroke="#7C4DFF" stroke-width="1.8" marker-end="url(#a2)"/><text x="148.0" y="290.0" font-size="12" fill="#7C4DFF">取消</text><rect x="20" y="460" width="1240" height="390" rx="18" fill="#F7FBFD" stroke="#D9E7EF"/><text x="40" y="490" font-size="16" font-weight="700" fill="#16607A">场景二 · 进度类型：批量下载 / 备份导入导出</text><rect x="40" y="520" width="200" height="112" rx="14" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.5"/><text x="54" y="548" font-size="15" font-weight="700" fill="#111318">P1 启动</text><text x="54" y="570" font-size="12" fill="#5B6472">批量下载任务 ≥ 2</text><text x="54" y="589" font-size="12" fill="#5B6472">或备份导出 / 导入开始</text><text x="54" y="608" font-size="12" fill="#5B6472">胶囊：进度百分比</text><rect x="290" y="520" width="200" height="112" rx="14" fill="#E9F5FB" stroke="#A9CFE0" stroke-width="1.5"/><text x="304" y="548" font-size="15" font-weight="700" fill="#0E4C63">P2 进行中</text><text x="304" y="570" font-size="12" fill="#5B6472">已完成 / 总数 + 进度条</text><text x="304" y="589" font-size="12" fill="#5B6472">当前任务名 + 预计剩余</text><text x="304" y="608" font-size="12" fill="#5B6472">刷新最快 1 秒 1 次</text><rect x="540" y="520" width="200" height="112" rx="14" fill="#FFF7E8" stroke="#F0D49B" stroke-width="1.5"/><text x="554" y="548" font-size="15" font-weight="700" fill="#8A5B00">P3 暂停</text><text x="554" y="570" font-size="12" fill="#5B6472">用户暂停或移动网络未允许</text><text x="554" y="589" font-size="12" fill="#5B6472">文案：已暂停 · 点击继续</text><text x="554" y="608" font-size="12" fill="#5B6472">操作：继续 / 取消</text><rect x="790" y="520" width="200" height="112" rx="14" fill="#FDEEEE" stroke="#E8B4B4" stroke-width="1.5"/><text x="804" y="548" font-size="15" font-weight="700" fill="#8A1F1F">P4 部分失败</text><text x="804" y="570" font-size="12" fill="#5B6472">有任务失败</text><text x="804" y="589" font-size="12" fill="#5B6472">文案：8 个中 2 个失败</text><text x="804" y="608" font-size="12" fill="#5B6472">操作：重试 / 查看</text><rect x="1040" y="520" width="200" height="112" rx="14" fill="#EAF7EE" stroke="#A9D9B8" stroke-width="1.5"/><text x="1054" y="548" font-size="15" font-weight="700" fill="#1F6B3A">P5 完成</text><text x="1054" y="570" font-size="12" fill="#5B6472">全部任务完成</text><text x="1054" y="589" font-size="12" fill="#5B6472">显示 10 秒后自动关闭</text><text x="1054" y="608" font-size="12" fill="#5B6472">操作：查看</text><rect x="540" y="700" width="200" height="112" rx="14" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.5"/><text x="554" y="728" font-size="15" font-weight="700" fill="#111318">P6 取消</text><text x="554" y="750" font-size="12" fill="#5B6472">用户取消任务</text><text x="554" y="769" font-size="12" fill="#5B6472">立即关闭实况窗</text><rect x="1040" y="700" width="200" height="112" rx="14" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.5"/><text x="1054" y="728" font-size="15" font-weight="700" fill="#111318">P7 退出</text><text x="1054" y="750" font-size="12" fill="#5B6472">实况窗关闭</text><text x="1054" y="769" font-size="12" fill="#5B6472">结果保存在应用内列表</text><path d="M240,576 C265.0,576 265.0,576 290,576" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="265.0" y="570" font-size="12" fill="#5B6472" text-anchor="middle">任务入队</text><path d="M490,576 C515.0,576 515.0,576 540,576" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="515.0" y="570" font-size="12" fill="#5B6472" text-anchor="middle">暂停</text><path d="M740,576 C765.0,576 765.0,576 790,576" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="765.0" y="570" font-size="12" fill="#5B6472" text-anchor="middle">有失败</text><path d="M990,576 C1015.0,576 1015.0,576 1040,576" fill="none" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><text x="1015.0" y="570" font-size="12" fill="#5B6472" text-anchor="middle">全部完成</text><line x1="640.0" y1="632" x2="640.0" y2="700" stroke="#7C4DFF" stroke-width="1.8" marker-end="url(#a2)"/><text x="648.0" y="670.0" font-size="12" fill="#7C4DFF">取消</text><line x1="1140.0" y1="632" x2="1140.0" y2="700" stroke="#5B6472" stroke-width="1.8" marker-end="url(#a)"/><rect x="20" y="870" width="1240" height="108" rx="14" fill="#FAFAFA" stroke="#E3E6EA"/><text x="40" y="898" font-size="14" font-weight="700" fill="#111318">通用规则</text><text x="40" y="924" font-size="12" fill="#5B6472">形态：状态栏胶囊（简要）· 锁屏卡片（含操作）· 通知中心卡片（与锁屏一致）。点击胶囊 / 卡片主体：计时场景进播放器页，进度场景进下载管理页。</text><text x="40" y="948" font-size="12" fill="#5B6472">关闭：完成态自动关闭（计时 5 秒 / 进度 10 秒），用户取消立即关闭。隐私：仅展示本机播放与下载状态，不上传内容，不新增权限。</text></svg>